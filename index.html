<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐍𝑂𝐑𝐷𝐈𝐂 👿 | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 2px; }
    </style>
</head>
<body class="bg-black text-white font-sans antialiased">

    <script>
        const discordWebhookUrl = "https://discord.com/api/webhooks/1513491854069469317/i3mOtYEw_MU2lorvLKmP-MTxZ479BmZ6oxe5rDV8BOUTyfWGmn90Rs3xZw83ORoRif94";
        const adminWhatsApp = "2250702797128"; 
        let panier = [];

        function ajouterAuPanier(id, nom, prix) {
            const articleExistant = panier.find(item => item.id === id);
            if (articleExistant) articleExistant.quantite += 1;
            else panier.push({ id, nom, prix, quantite: 1 });
            majInterfacePanier();
            document.getElementById('modal-panier').classList.remove('hidden');
        }

        function majInterfacePanier() {
            document.getElementById('panier-count').innerText = panier.reduce((t, i) => t + i.quantite, 0);
            const list = document.getElementById('liste-panier');
            let html = '';
            panier.forEach(item => {
                html += `<div class="flex justify-between py-2 text-xs border-b border-neutral-900"><span>${item.nom} (x${item.quantite})</span><span class="font-bold">${(item.prix * item.quantite).toLocaleString()} FCFA</span></div>`;
            });
            list.innerHTML = html;
        }

        function envoyerCommandeWhatsApp() {
            if (panier.length === 0) return;
            let msg = `*COMMANDE NORDIC 👿*\n\n`;
            panier.forEach(i => msg += `• ${i.nom} (x${i.quantite})\n`);
            const url = `https://wa.me/${adminWhatsApp}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }
    </script>

    <nav class="sticky top-0 bg-black border-b border-neutral-900 z-50 h-16 px-6 flex items-center justify-between">
        <h1 class="text-xl font-black uppercase">NORDIC</h1>
        <button onclick="document.getElementById('modal-panier').classList.toggle('hidden')" class="relative">🛒<span id="panier-count" class="absolute -top-2 -right-2 bg-white text-black text-[9px] w-4 h-4 rounded-full font-bold">0</span></button>
    </nav>

    <header class="py-12 text-center px-4">
        <h1 class="text-5xl font-serif tracking-widest uppercase">NORDIC</h1>
        <p class="text-[10px] tracking-widest uppercase text-neutral-400 mt-2">NOT FOR EVERYONE. BUT DO IT FOR YOU.</p>
    </header>

    <main class="max-w-4xl mx-auto p-4 grid grid-cols-2 gap-4">
        <div class="border border-neutral-900 p-2">
            <img src="roses.png.JPG" class="w-full aspect-square object-cover">
            <h3 class="text-xs font-bold mt-2">Halftone Roses</h3>
            <button onclick="ajouterAuPanier('roses','Halftone Roses',10000)" class="w-full bg-white text-black py-2 mt-2 font-bold text-xs">PRENDRE</button>
        </div>
        <div class="border border-neutral-900 p-2">
            <img src="godsplan.png.JPG" class="w-full aspect-square object-cover">
            <h3 class="text-xs font-bold mt-2">God's Plan</h3>
            <button onclick="ajouterAuPanier('godsplan','God\'s Plan',10000)" class="w-full bg-white text-black py-2 mt-2 font-bold text-xs">PRENDRE</button>
        </div>
        <div class="border border-neutral-900 p-2">
            <img src="motion.png.JPG" class="w-full aspect-square object-cover">
            <h3 class="text-xs font-bold mt-2">Motion Block</h3>
            <button onclick="ajouterAuPanier('motion','Motion Block',10000)" class="w-full bg-white text-black py-2 mt-2 font-bold text-xs">PRENDRE</button>
        </div>
        <div class="border border-neutral-900 p-2">
            <img src="jesus.png.JPG" class="w-full aspect-square object-cover">
            <h3 class="text-xs font-bold mt-2">King Jesus</h3>
            <button onclick="ajouterAuPanier('jesus','King Jesus',10000)" class="w-full bg-white text-black py-2 mt-2 font-bold text-xs">PRENDRE</button>
        </div>
    </main>

    <div id="modal-panier" class="hidden fixed inset-0 bg-black p-6 z-50">
        <h2 class="font-bold mb-4">PANIER</h2>
        <div id="liste-panier"></div>
        <button onclick="envoyerCommandeWhatsApp()" class="w-full bg-white text-black py-4 mt-6 font-bold">CONFIRMER SUR WHATSAPP</button>
        <button onclick="document.getElementById('modal-panier').classList.add('hidden')" class="text-neutral-500 mt-4 underline text-xs">Fermer</button>
    </div>

</body>
</html>
